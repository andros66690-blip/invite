<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FÉERIE: A FANTASY AFFAIR</title>
<style>
  :root {
    --accent: #e63996;
    --accent-rgb: 230, 57, 150;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    background: #0a0812;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2c2c3a;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 45%,
      rgba(var(--accent-rgb), 0.5) 0%,
      transparent 55%);
    opacity: 0;
    transition: opacity 1.6s ease;
    pointer-events: none;
    z-index: 0;
  }
  body.opened::before { opacity: 1; }

  /* ======================= СЦЕНА ======================= */
  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 42px;
  }

  .envelope {
    position: relative;
    width: 340px;
    height: 240px;
    perspective: 1400px;
    cursor: pointer;
    animation: breathe 3.5s ease-in-out infinite;
    transition: transform 0.5s ease;
  }

  .envelope:hover { animation-play-state: paused; transform: scale(1.05); }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }

  .envelope.open {
    animation: none;
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
    transition: opacity 0.6s ease 1.3s, transform 0.6s ease 1.3s;
  }

  .envelope__back {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #f0e8d8 0%, #d8ccb4 100%);
    border-radius: 8px;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  .envelope__pocket {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #faf4e6 0%, #e8dcc4 100%);
    border-radius: 8px;
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    z-index: 3;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }

  .envelope__flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 55%;
    background: linear-gradient(180deg, #efe6d0 0%, #d4c8ac 100%);
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    transform-origin: top center;
    transition: transform 0.9s cubic-bezier(0.6, 0, 0.4, 1);
    z-index: 4;
    backface-visibility: hidden;
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.15));
  }

  .envelope.open .envelope__flap {
    transform: rotateX(-180deg);
  }

  .envelope__seal {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #c0392b, #7a1a1a);
    box-shadow:
      inset 0 -3px 6px rgba(0, 0, 0, 0.45),
      inset 0 3px 6px rgba(255, 255, 255, 0.2),
      0 3px 8px rgba(0, 0, 0, 0.45);
    z-index: 5;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .envelope__seal::after {
    content: '✦';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(255, 255, 255, 0.75);
    font-size: 18px;
  }
  .envelope.open .envelope__seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
  }

  .letter {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    top: 24px;
    background: #fafaf6;
    border-radius: 6px;
    z-index: 2;
    transform: translateY(0);
    transition: transform 1s cubic-bezier(0.6, 0, 0.3, 1) 0.5s;
    overflow: hidden;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
    display: grid;
    place-items: center;
    color: #c8b898;
    letter-spacing: 6px;
    font-size: 14px;
  }

  .envelope.open .letter {
    transform: translateY(-70%);
  }

  /* ======================= КАРТОЧКА ======================= */
  .card {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.4s ease 1.5s;
  }
  .card.show {
    opacity: 1;
    pointer-events: auto;
  }

  .card__inner {
    position: relative;
    width: min(460px, 100%);
    background: #ffffff;
    border-radius: 22px;
    padding: 56px 40px 48px;
    text-align: center;
    box-shadow:
      0 40px 80px -20px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.06);
    transform: translateY(30px) scale(0.94);
    opacity: 0;
    transition:
      transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 1.5s,
      opacity 0.9s ease 1.5s;
    overflow: hidden;
  }
  .card.show .card__inner {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  .card__inner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--accent);
    transition: background 1s ease;
  }

  .card__label {
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #9a9aaa;
    margin-bottom: 20px;
  }

  .card__name {
    font-size: 28px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .card__subtitle {
    font-size: 13px;
    color: #7a7a8c;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .swatch {
    width: 96px;
    height: 96px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow:
      0 14px 32px -8px rgba(var(--accent-rgb), 0.7),
      inset 0 -6px 12px rgba(0, 0, 0, 0.15),
      inset 0 6px 12px rgba(255, 255, 255, 0.35);
    transition: background 1s ease, box-shadow 1s ease;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  .card__color-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #9a9aaa;
    margin-bottom: 6px;
    transition: color 1s ease;
  }

  .card__color-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 18px;
    letter-spacing: -0.3px;
    transition: color 1s ease;
  }

  .card__traits {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #6a6a7c;
    margin-bottom: 24px;
    font-weight: 500;
  }

  .card__divider {
    width: 40px;
    height: 1px;
    background: #e0e0ea;
    margin: 0 auto 24px;
  }

  .card__text {
    font-size: 15px;
    line-height: 1.7;
    color: #4a4a5c;
    text-align: left;
  }
  .card__text strong {
    color: #1a1a2e;
    font-weight: 600;
  }

  .hint {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 4px;
    text-transform: uppercase;
    animation: hintPulse 2.5s ease-in-out infinite;
    transition: opacity 0.4s ease;
    cursor: pointer;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.95; }
  }
  .hint.hidden { opacity: 0; pointer-events: none; }

  @media (max-width: 480px) {
    .envelope { width: 280px; height: 200px; }
    .card__inner { padding: 44px 26px 36px; }
    .card__name { font-size: 24px; }
    .card__color-title { font-size: 22px; }
    .swatch { width: 80px; height: 80px; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="envelope" id="envelope">
      <div class="envelope__back"></div>
      <div class="letter">✦ ✦ ✦</div>
      <div class="envelope__pocket"></div>
      <div class="envelope__flap"></div>
      <div class="envelope__seal"></div>
    </div>
    <p class="hint" id="hint">Нажмите на конверт</p>
  </div>

  <div class="card" id="card">
    <div class="card__inner">
      <div class="card__label">FÉERIE · A FANTASY AFFAIR</div>
      <div class="card__name" id="nameEl">Гость</div>
      <div class="card__subtitle">Ваша магическая энергия на этот вечер</div>
      <div class="swatch"></div>
      <div class="card__color-name" id="colorNameEl">—</div>
      <div class="card__color-title" id="colorTitleEl">—</div>
      <div class="card__traits" id="traitsEl">—</div>
      <div class="card__divider"></div>
      <p class="card__text" id="recommendationsEl"></p>
    </div>
  </div>

<script>
  // =================== 8 базовых цветов ===================
  // Ключи для URL: pink, orange, lilac, golden, blue, green, cherry, pearl
  const COLORS = {
    pink: {
      hex: '#e63996', rgb: '230, 57, 150',
      name: 'FAIRY PINK',
      title: 'Фуксия',
      traits: 'Яркая магия · Смелость · Игривость',
      text: 'Насыщенный, сочный розовый — цвет дофаминового всплеска, кокетства и беззаботной радости. Для тех, кто любит быть заметным и добавлять образу дерзкий акцент.'
    },
    orange: {
      hex: '#f57e20', rgb: '245, 126, 32',
      name: 'PIXIE ORANGE',
      title: 'Мандариновый',
      traits: 'Энергия · Тепло · Спонтанность',
      text: 'Солнечный мандариновый оттенок, наполненный движением и жизнью. Он символизирует искру, веселье и ту самую магию, которая превращает обычный вечер в приключение.'
    },
    lilac: {
      hex: '#a98ed6', rgb: '169, 142, 214',
      name: 'MYSTIC LILAC',
      title: 'Лавандовый',
      traits: 'Загадка · Мечтательность · Интуиция',
      text: 'Дымчатая лаванда с мистическим сиянием. Цвет лунного света, тайных желаний и фантазий, которые постепенно становятся реальностью.'
    },
    golden: {
      hex: '#f2cd5c', rgb: '242, 205, 92',
      name: 'GOLDEN FAIRY',
      title: 'Сливочно-жёлтый',
      traits: 'Сияние · Лёгкость · Оптимизм',
      text: 'Нежный оттенок сливочного масла с золотистым свечением. Он напоминает солнечные блики, тёплые мечты и волшебную пыльцу в воздухе.'
    },
    blue: {
      hex: '#1e5fd6', rgb: '30, 95, 214',
      name: 'FAIRY BLUE',
      title: 'Кобальтовый',
      traits: 'Сила · Тайна · Магнетизм',
      text: 'Глубокий, электрический синий — как ночное небо в момент, когда загораются звёзды. Цвет уверенности, внутренней силы и притягательной загадочности.'
    },
    green: {
      hex: '#8fc47a', rgb: '143, 196, 122',
      name: 'ENCHANTED GREEN',
      title: 'Фисташковый',
      traits: 'Свежесть · Природа · Обновление',
      text: 'Светлый фисташковый — словно цвет зачарованного сада на рассвете. Он приносит в сказку спокойствие, свежесть и ощущение нового начала.'
    },
    cherry: {
      hex: '#8a1528', rgb: '138, 21, 40',
      name: 'CHERRY SPELL',
      title: 'Вишнёвый',
      traits: 'Страсть · Соблазн · Драма',
      text: 'Глубокий вишнёво-красный с оттенком вина. Цвет запретных желаний, чувственности и эффектных появлений — немного тёмной магии в мире ярких красок.'
    },
    pearl: {
      hex: '#a8b4c4', rgb: '168, 180, 196',
      name: 'PEARL MUSE',
      title: 'Жемчужно-серебряный',
      traits: 'Элегантность · Свет · Невесомость',
      text: 'Перламутровый серебристый с холодным сиянием. Он напоминает лунное отражение на воде, хрусталь и тонкую магию, которая не нуждается в ярких словах.'
    }
  };

  // =================== Читаем параметры из URL ===================
  const params = new URLSearchParams(location.search);
  const key    = (params.get('color') || 'pink').toLowerCase();
  const name   = params.get('name') || 'Дорогой гость';
  const color  = COLORS[key] || COLORS.pink;

  // =================== Подставляем данные ===================
  document.documentElement.style.setProperty('--accent', color.hex);
  document.documentElement.style.setProperty('--accent-rgb', color.rgb);

  document.getElementById('nameEl').textContent          = name;
  document.getElementById('colorNameEl').textContent     = color.name;
  document.getElementById('colorTitleEl').textContent    = color.title;
  document.getElementById('traitsEl').textContent        = color.traits;
  document.getElementById('recommendationsEl').innerHTML = color.text;

  // =================== Логика открытия ===================
  const envelope = document.getElementById('envelope');
  const hint     = document.getElementById('hint');
  const card     = document.getElementById('card');
  let opened     = false;

  function openEnvelope() {
    if (opened) return;
    opened = true;

    envelope.classList.add('open');
    hint.classList.add('hidden');
    document.body.classList.add('opened');

    setTimeout(() => card.classList.add('show'), 1500);
  }

  envelope.addEventListener('click', openEnvelope);
  hint.addEventListener('click', openEnvelope);
</script>
</body>
</html>
